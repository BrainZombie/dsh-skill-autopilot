name: ci

# `npm test` is fixture-based: the unit gates always run, and the two sections
# that need a live install (plugin-skill inventory, isolated end-to-end against
# the mnemon data source) skip themselves when that install is absent — a clean
# runner is the normal case, not a failure.
#
# `node test/host-contract.mjs` and `dsh-plugin verify .` need a real DSH host
# and are documented in README (Develop) instead.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Self test
        run: npm test
